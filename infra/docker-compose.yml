version: "3.9"

services:
  reverse-proxy:
    image: nginx:stable
    depends_on:
      - web-client
      - core-api
      - keycloak
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - app-net

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init-keycloak.sql:/docker-entrypoint-initdb.d/init-keycloak.sql:ro
    networks:
      - app-net

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - app-net

  fhir-server:
    build:
      context: ./fhir
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/appdb
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppassword
    depends_on:
      - db
    networks:
      - app-net

  core-api:
    build: ../services/core-api
    environment:
      DATABASE_URL: postgres://appuser:apppassword@db:5432/appdb
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      FHIR_BASE_URL: http://fhir-server:8080/fhir
      OIDC_ISSUER_URL: http://keycloak:8080/realms/app
      MINIO_BUCKET: medical-docs
    depends_on:
      - db
      - minio
      - fhir-server
      - keycloak
    networks:
      - app-net

  doc-processor:
    build: ../services/doc-processor
    environment:
      DATABASE_URL: postgres://appuser:apppassword@db:5432/appdb
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: medical-docs
      FHIR_BASE_URL: http://fhir-server:8080/fhir
      AI_SERVICE_URL: http://ai-service:8000
      OIDC_ISSUER_URL: http://keycloak:8080/realms/app
    depends_on:
      - db
      - minio
      - ai-service
      - core-api
    networks:
      - app-net

  ai-service:
    build: ../services/ai-service
    environment:
      MODEL_BACKEND: "stub"
    networks:
      - app-net

  web-client:
    build: ../web-client
    depends_on:
      - core-api
      - keycloak
    networks:
      - app-net

networks:
  app-net:

volumes:
  db_data:
  minio_data:
